[package]
name = "cubeb-coreaudio"
version = "0.1.0"
authors = ["Chun-Min Chang <chun.m.chang@gmail.com>", "Paul Adenot <paul@paul.cx>"]
license = "ISC"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
bitflags = "2"
coreaudio-sys-utils = { path = "coreaudio-sys-utils" }
cubeb-backend = "0.39"
float-cmp = "0.6"
libc = "0.2"
mach2 = "0.4"
num-traits = "0.2"
audio-mixer = "0.2"
ringbuf = "0.5.2"
triple_buffer = "5.0.5"
whatsys = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat"] }

[dev-dependencies]
itertools = "0.11"

[features]
audio-dump = []
vpio-forcelist = []
gecko-in-tree = ["cubeb-backend/gecko-in-tree"]
tsan-annotations = []
no-private-apis = ["coreaudio-sys-utils/no-private-apis"]

# Workaround for https://github.com/rust-lang/cargo/issues/6745 to allow this
# Cargo.toml file to appear under a subdirectory of a workspace without being in
# that workspace (e.g. in cubeb-rs).
[workspace]
